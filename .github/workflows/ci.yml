name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality and MCP SDK 2 smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Enforce SDK 2 dependency contract
        run: |
          uv run python -c "from importlib.metadata import version; from mcp.server.mcpserver import MCPServer; print(version('mcp')); assert MCPServer"
          ! rg 'mcp\.server\.fastmcp|FastMCP' src tests pyproject.toml

      - name: Lint, format and type-check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src

      - name: Test core, plugin package and protocol transports
        env:
          CGU_PROVIDER: passthrough
          CGU_NETWORK: "off"
        run: uv run python -m pytest -q

      - name: Build distributions
        run: uv build

      - name: Audit wheel in an isolated environment
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "from cgu.infrastructure.config import Settings; from cgu.interfaces.mcp.server import create_server; s = create_server(Settings.from_env()); assert s.name == 'creativity-generation-unit', s.name"
          .wheel-smoke/bin/cgu doctor
