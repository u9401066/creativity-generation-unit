name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality and MCP SDK 2 smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Enforce SDK 2 dependency contract
        run: |
          uv run python -c "from importlib.metadata import version; from mcp.server.mcpserver import MCPServer; print(version('mcp')); assert MCPServer"
          ! rg 'mcp\.server\.fastmcp|FastMCP' src tests pyproject.toml

      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Test core and protocol transports
        env:
          CGU_LLM_PROVIDER: passthrough
        run: uv run python -m pytest -q

      - name: Build distributions
        run: uv build

      - name: Audit wheel in an isolated environment
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python -c "from cgu.server import mcp; from mcp import Client; assert mcp.name == 'creativity-generation-unit'; assert Client"
