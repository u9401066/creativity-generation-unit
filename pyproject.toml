[project]
name = "creativity-generation-unit"
version = "0.6.0"
description = "CGU - MCP-based Agent-to-Agent Creative Idea Generator with Fast/Slow Thinking"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "u9401066", email = "u9401066@gap.kmu.edu.tw" }]
keywords = ["mcp", "agent", "creativity", "langgraph", "ollama", "qwen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Official MCP Python SDK 2 (SDK 1 is intentionally unsupported)
    "mcp>=2,<3",
    # LangGraph 1.0+ for Agent Orchestration (Functional API)
    "langgraph>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    # OpenAI-compatible API client (for vLLM)
    "openai>=1.0.0",
    # Structured Output
    "pydantic>=2.12,<3",
    "instructor>=1.0.0",
    # Web Search
    "duckduckgo-search>=6.0.0",
    # Utilities
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "langchain-ollama>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

# Ollama Python SDK (可選)
ollama = [
    "ollama>=0.4.0",
]

[project.scripts]
cgu = "cgu.cli:main"
cgu-server = "cgu.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgu"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live external LLM backend",
]
