[project]
name = "creativity-generation-unit"
version = "0.8.0"
description = "CGU - an MCP server for frame-aware ideation: work orders, honest novelty measurement, frame operators and session-scoped persistence"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "u9401066", email = "u9401066@gap.kmu.edu.tw" }]
keywords = [
    "mcp",
    "creativity",
    "ideation",
    "frame-operators",
    "novelty-measurement",
    "work-order",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "jsonschema",
]

[project.urls]
Homepage = "https://github.com/u9401066/creativity-generation-unit"
Repository = "https://github.com/u9401066/creativity-generation-unit"
Issues = "https://github.com/u9401066/creativity-generation-unit/issues"

[project.scripts]
cgu-server = "cgu.interfaces.mcp.server:main"
cgu = "cgu.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgu"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live external backend (for example a running Ollama)",
]
